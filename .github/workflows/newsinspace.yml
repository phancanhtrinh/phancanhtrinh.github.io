name: NewsInSpace daily update

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest papers
        run: python3 scripts/fetch_newsinspace.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- _data/newsinspace.json; then
            echo "No changes to newsinspace.json, skipping commit."
            exit 0
          fi
          git add _data/newsinspace.json
          git commit -m "NewsInSpace: daily update ($(date -u +%Y-%m-%d))"
          git push
