<script>
(function () {
	var DEFAULT_NAMESPACE = 'phancanhtrinh-newsinspace';
	var buttons = document.querySelectorAll('.nis-like-btn');

	function setLiked(btn) {
		btn.classList.add('liked');
		var icon = btn.querySelector('i');
		icon.classList.remove('fa-heart-o');
		icon.classList.add('fa-heart');
	}

	// Resolves to a real count, or null if the read couldn't be trusted
	// (rate limiting, network hiccup, unexpected response shape...). A 404
	// is the one case Abacus uses to mean "this key has never been hit" --
	// that's a confirmed zero, not a failure. Callers must leave the
	// display untouched on null rather than guess with a 0, since with
	// dozens of like buttons firing GETs on every page load, transient
	// failures are common and showing 0 for them looks like lost data.
	function readCount(promise) {
		return promise
			.then(function (r) {
				if (r.status === 404) return 0;
				if (!r.ok) return null;
				return r.json().then(function (data) {
					return typeof data.value === 'number' ? data.value : null;
				});
			})
			.catch(function () { return null; });
	}

	buttons.forEach(function (btn) {
		var key = btn.getAttribute('data-like-key');
		if (!key) return;
		var namespace = btn.getAttribute('data-like-ns') || DEFAULT_NAMESPACE;
		var countEl = btn.querySelector('.nis-like-count');
		var storageKey = 'nis_liked_' + namespace + '_' + key;
		var cacheKey = 'nis_count_' + namespace + '_' + key;
		// Guards against the page-load GET resolving after the click-triggered
		// hit and clobbering the fresh count back down to its stale pre-click value.
		var justLiked = false;

		if (localStorage.getItem(storageKey) === '1') {
			setLiked(btn);
		}

		// Show the last known-good count immediately so a slow/failed
		// network request doesn't leave the placeholder (or a stale value)
		// on screen while re-fetching in the background.
		var cached = localStorage.getItem(cacheKey);
		if (cached !== null) countEl.textContent = cached;

		readCount(fetch('https://abacus.jasoncameron.dev/get/' + namespace + '/' + key))
			.then(function (value) {
				if (justLiked || value === null) return;
				countEl.textContent = value;
				localStorage.setItem(cacheKey, value);
			});

		btn.addEventListener('click', function () {
			if (btn.classList.contains('liked')) return;
			justLiked = true;
			setLiked(btn);
			localStorage.setItem(storageKey, '1');
			var current = parseInt(countEl.textContent, 10);
			countEl.textContent = isNaN(current) ? 1 : current + 1;
			readCount(fetch('https://abacus.jasoncameron.dev/hit/' + namespace + '/' + key))
				.then(function (value) {
					// On failure, keep the optimistic value above -- the like
					// was still recorded locally even if we can't confirm the count.
					if (value === null) return;
					countEl.textContent = value;
					localStorage.setItem(cacheKey, value);
				});
		});
	});
})();
</script>
