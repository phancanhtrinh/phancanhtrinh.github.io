<script>
(function () {
	var API = 'https://phancanhtrinh-likes.rubic992.workers.dev';
	var DEFAULT_NAMESPACE = 'phancanhtrinh-newsinspace';
	var buttons = document.querySelectorAll('.nis-like-btn');

	function setLikedUI(btn, liked) {
		btn.classList.toggle('liked', liked);
		var icon = btn.querySelector('i');
		icon.classList.toggle('fa-heart-o', !liked);
		icon.classList.toggle('fa-heart', liked);
	}

	buttons.forEach(function (btn) {
		var key = btn.getAttribute('data-like-key');
		if (!key) return;
		var namespace = btn.getAttribute('data-like-ns') || DEFAULT_NAMESPACE;
		var countEl = btn.querySelector('.nis-like-count');
		var storageKey = 'nis_liked_' + namespace + '_' + key;
		var qs = 'ns=' + encodeURIComponent(namespace) + '&key=' + encodeURIComponent(key);

		setLikedUI(btn, localStorage.getItem(storageKey) === '1');

		fetch(API + '/stats?' + qs)
			.then(function (r) { return r.json(); })
			.then(function (data) { countEl.textContent = data.likes; })
			.catch(function () {});

		btn.addEventListener('click', function () {
			if (btn.classList.contains('busy')) return;
			var liked = localStorage.getItem(storageKey) === '1';
			var path = liked ? '/unlike' : '/like';

			btn.classList.add('busy');
			// Optimistic update so the click feels instant.
			var current = parseInt(countEl.textContent, 10);
			if (!isNaN(current)) countEl.textContent = liked ? Math.max(0, current - 1) : current + 1;
			setLikedUI(btn, !liked);

			fetch(API + path + '?' + qs, { method: 'POST' })
				.then(function (r) { return r.json(); })
				.then(function (data) {
					countEl.textContent = data.likes;
					if (liked) localStorage.removeItem(storageKey);
					else localStorage.setItem(storageKey, '1');
				})
				.catch(function () {
					// Request failed -- revert the optimistic UI change.
					setLikedUI(btn, liked);
					if (!isNaN(current)) countEl.textContent = current;
				})
				.finally(function () { btn.classList.remove('busy'); });
		});
	});
})();
</script>
